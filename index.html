<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prabhux</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:ital,wght@0,400;1,400;1,500&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <section class="hero">
        <!-- Layer order (back to front): mountain, clouds, grill, content, headshot, leaves -->
        <div class="hero-layer hero-mountain" data-speed="0.4">
          <img src="assets/images/mountain-bg.png" alt="" />
        </div>

        <div class="hero-layer hero-grill" data-speed="0.8">
          <img src="assets/images/grill.png" alt="" />
        </div>

        <header class="hero-nav">
          <nav class="nav-pill">
            <span class="nav-logo">prabhux</span>
            <a href="#my-story">My Story</a>
            <a href="#my-craft">My Craft</a>
            <a href="library.html">Library</a>
            <a href="#contact" class="nav-cta">Share Stories</a>
          </nav>
          <button
            type="button"
            class="sound-toggle is-muted"
            aria-label="Play background music"
            aria-pressed="false"
          >
            <svg viewBox="0 0 24 24" class="icon-sound-on" aria-hidden="true">
              <path
                fill="currentColor"
                d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-.77-3.29-2-4.32v8.64c1.23-1.03 2-2.55 2-4.32zM14.5 5.5v1.79c2.89 1.15 4.5 4.06 4.5 6.71 0 2.65-1.61 5.56-4.5 6.71v1.79c3.61-.83 6.5-4.13 6.5-8.5s-2.89-7.67-6.5-8.5z"
              />
            </svg>
            <svg viewBox="0 0 24 24" class="icon-sound-off" aria-hidden="true">
              <path
                fill="currentColor"
                d="M16.5 12c0-1.77-.77-3.29-2-4.32v2.7l1.95 1.95c.03-.1.05-.21.05-.33zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.79 5 3.42 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"
              />
            </svg>
          </button>
        </header>

        <div class="hero-content" data-speed="1">
          <h1 class="hero-headline">
            <span class="headline-script">where i find inspiration,</span
            ><br />
            <span class="headline-italic">I find my best ideas.</span>
          </h1>
          <div class="hero-actions">
            <a href="#my-craft" class="btn btn-filled">My Craft</a>
          </div>
        </div>

        <div class="hero-layer hero-headshot" data-speed="1">
          <img src="assets/images/headshot.png" alt="Prabhux" />
        </div>

        <div class="hero-layer hero-leaf-upper" data-speed="1.35">
          <img class="leaf-img" src="assets/images/leaf-upper.png" alt="" />
        </div>
        <div class="hero-layer hero-leaf-lower" data-speed="1.35">
          <img
            class="leaf-img leaf-img-lower"
            src="assets/images/leaf-lower.png"
            alt=""
          />
        </div>
      </section>
    </main>
    <audio id="bg-music" src="assets/audio/ambient-bg.mp3" loop preload="none"></audio>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="js/main.js" defer></script>
  </body>
</html>
